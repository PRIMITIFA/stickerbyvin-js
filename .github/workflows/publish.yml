# Publishes to npm when a GitHub release is published. Needs the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate New Token -> Granular, read and write, package stickerbyvin, bypass 2FA on).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', registry-url: 'https://registry.npmjs.org' }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
